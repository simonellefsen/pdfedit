[package]
name = "pdfedit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
hayro = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lopdf = "0.47.0"
rfd = "0.18.0"

# Rasterizing pages in an unoptimized build is too slow to use; optimize
# dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
